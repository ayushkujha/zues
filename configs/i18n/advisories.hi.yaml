# Hindi advisory templates. Placeholders must match configs/advisory_rules.yaml.
# reviewed: set to true only after a native speaker / agromet expert checks the text.
language: hi
reviewed: false

crops:
  all: सभी फसलें
  paddy: धान
  maize: मक्का
  soybean: सोयाबीन
  groundnut: मूंगफली
  cotton: कपास
  chickpea: चना
  sorghum: रबी ज्वार
  greengram: मूंग
  wheat: गेहूं

stages:
  sowing: बुवाई
  vegetative: वानस्पतिक
  flowering: फूल
  maturity: परिपक्वता

rules:
  HEAVY_RAIN: "{day} को भारी बारिश ({rain:.0f} मिमी) की संभावना है। खेतों से अतिरिक्त पानी निकालें, बुवाई और उर्वरक डालना टालें, और कटी हुई उपज को सुरक्षित, ढकी हुई जगह पर रखें।"
  SPRAY_POSTPONE_RAIN: "अगले 2 दिनों में {rain:.0f} मिमी तक बारिश की संभावना है। कीटनाशक और उर्वरक का छिड़काव सूखे दिन तक टालें।"
  FERTILISER_WASHOFF: "मध्यम बारिश ({rain:.0f} मिमी) की संभावना है। उर्वरक बह न जाए, इसलिए टॉप-ड्रेसिंग टालें।"
  SKIP_IRRIGATION: "अगले 3 दिनों में लगभग {total:.0f} मिमी बारिश की संभावना है। सिंचाई न करें और पानी बचाएं।"
  DRY_SPELL_IRRIGATE: "अगले 5 दिन मौसम शुष्क रहेगा और तापमान {tmax:.0f}°C तक जा सकता है। {crop} {stage} अवस्था में है: जीवनरक्षक सिंचाई करें और मिट्टी की नमी बचाने के लिए मल्चिंग करें।"
  HEAT_STRESS_FLOWERING: "{day} को {crop} की फूल अवस्था के दौरान तापमान {tmax:.0f}°C तक रहेगा। गर्मी का तनाव कम करने के लिए शाम को हल्की सिंचाई करें।"
  HEAT_LIVESTOCK: "आने वाले दिन बहुत गर्म रहेंगे ({tmax:.0f}°C तक)। पशुओं को छाया में रखें, भरपूर पीने का पानी दें, और दोपहर 12 से 3 बजे के बीच खेत का काम न करें।"
  COLD_NIGHTS: "रातें ठंडी रहेंगी (न्यूनतम {tmin:.0f}°C)। फसलों को बचाने के लिए शाम को हल्की सिंचाई करें और छोटे पशुओं को गर्म रखें।"
  FUNGAL_DISEASE_RISK: "गर्म और नम मौसम ({rh:.0f}% से अधिक आर्द्रता) {crop} में फफूंद रोगों के लिए अनुकूल है। फसल की नियमित निगरानी करें और सूखे दिन पौध संरक्षण उपाय करें।"
  HIGH_WIND: "तेज हवाएं ({wind:.0f} किमी/घंटा तक) चलने की संभावना है। छिड़काव न करें और ऊंची फसलों व छोटे पेड़ों को सहारा दें।"
  SOWING_FAVOURABLE: "अगले 3 दिनों में {total:.0f} मिमी बारिश से मिट्टी में अच्छी नमी रहेगी। {crop} की बुवाई के लिए परिस्थितियां अनुकूल हैं।"
  HARVEST_RAIN: "{day} को बारिश ({rain:.0f} मिमी) की संभावना है और {crop} कटाई के लिए तैयार है। संभव हो तो बारिश से पहले कटाई करें और उपज को ढककर रखें।"
  SPRAY_WINDOW: "अगले 2 दिन मौसम सूखा और शांत रहेगा: आवश्यकता हो तो छिड़काव के लिए अच्छा समय है।"
