# Kannada advisory templates. Placeholders must match configs/advisory_rules.yaml.
# reviewed: set to true only after a native speaker / agromet expert checks the text.
language: kn
reviewed: false

crops:
  all: ಎಲ್ಲಾ ಬೆಳೆಗಳು
  paddy: ಭತ್ತ
  maize: ಮೆಕ್ಕೆಜೋಳ
  soybean: ಸೋಯಾಬೀನ್
  groundnut: ಶೇಂಗಾ
  cotton: ಹತ್ತಿ
  chickpea: ಕಡಲೆ
  sorghum: ಹಿಂಗಾರು ಜೋಳ
  greengram: ಹೆಸರು
  wheat: ಗೋಧಿ

stages:
  sowing: ಬಿತ್ತನೆ
  vegetative: ಸಸ್ಯಕ ಬೆಳವಣಿಗೆ
  flowering: ಹೂಬಿಡುವ
  maturity: ಪಕ್ವತೆ

rules:
  HEAVY_RAIN: "{day} ರಂದು ಭಾರೀ ಮಳೆ ({rain:.0f} ಮಿ.ಮೀ) ಆಗುವ ಸಾಧ್ಯತೆ ಇದೆ. ಹೊಲಗಳಿಂದ ಹೆಚ್ಚುವರಿ ನೀರನ್ನು ಹೊರಹಾಕಿ, ಬಿತ್ತನೆ ಮತ್ತು ರಸಗೊಬ್ಬರ ಹಾಕುವುದನ್ನು ಮುಂದೂಡಿ, ಕಟಾವು ಮಾಡಿದ ಉತ್ಪನ್ನವನ್ನು ಸುರಕ್ಷಿತ, ಮುಚ್ಚಿದ ಸ್ಥಳದಲ್ಲಿ ಇಡಿ."
  SPRAY_POSTPONE_RAIN: "ಮುಂದಿನ 2 ದಿನಗಳಲ್ಲಿ {rain:.0f} ಮಿ.ಮೀ ವರೆಗೆ ಮಳೆಯಾಗುವ ಸಾಧ್ಯತೆ ಇದೆ. ಕೀಟನಾಶಕ ಮತ್ತು ರಸಗೊಬ್ಬರ ಸಿಂಪರಣೆಯನ್ನು ಒಣ ದಿನದವರೆಗೆ ಮುಂದೂಡಿ."
  FERTILISER_WASHOFF: "ಸಾಧಾರಣ ಮಳೆ ({rain:.0f} ಮಿ.ಮೀ) ಆಗುವ ಸಾಧ್ಯತೆ ಇದೆ. ರಸಗೊಬ್ಬರ ಕೊಚ್ಚಿಹೋಗದಂತೆ ಮೇಲುಗೊಬ್ಬರ ಹಾಕುವುದನ್ನು ಮುಂದೂಡಿ."
  SKIP_IRRIGATION: "ಮುಂದಿನ 3 ದಿನಗಳಲ್ಲಿ ಸುಮಾರು {total:.0f} ಮಿ.ಮೀ ಮಳೆಯಾಗುವ ಸಾಧ್ಯತೆ ಇದೆ. ನೀರಾವರಿ ಮಾಡಬೇಡಿ, ನೀರನ್ನು ಉಳಿಸಿ."
  DRY_SPELL_IRRIGATE: "ಮುಂದಿನ 5 ದಿನ ಒಣ ಹವಾಮಾನ ಇದ್ದು ತಾಪಮಾನ {tmax:.0f}°C ವರೆಗೆ ಏರಬಹುದು. {crop} {stage} ಹಂತದಲ್ಲಿದೆ: ರಕ್ಷಣಾತ್ಮಕ ನೀರಾವರಿ ನೀಡಿ ಮತ್ತು ಮಣ್ಣಿನ ತೇವಾಂಶ ಉಳಿಸಲು ಹೊದಿಕೆ (ಮಲ್ಚ್) ಬಳಸಿ."
  HEAT_STRESS_FLOWERING: "{day} ರಂದು {crop} ಹೂಬಿಡುವ ಹಂತದಲ್ಲಿರುವಾಗ ತಾಪಮಾನ {tmax:.0f}°C ಇರಲಿದೆ. ಶಾಖದ ಒತ್ತಡ ಕಡಿಮೆ ಮಾಡಲು ಸಂಜೆ ಲಘು ನೀರಾವರಿ ನೀಡಿ."
  HEAT_LIVESTOCK: "ಮುಂದಿನ ದಿನಗಳು ತುಂಬಾ ಬಿಸಿಯಾಗಿರಲಿವೆ ({tmax:.0f}°C ವರೆಗೆ). ಜಾನುವಾರುಗಳನ್ನು ನೆರಳಿನಲ್ಲಿ ಇರಿಸಿ, ಸಾಕಷ್ಟು ಕುಡಿಯುವ ನೀರು ನೀಡಿ, ಮಧ್ಯಾಹ್ನ 12 ರಿಂದ 3 ಗಂಟೆಯವರೆಗೆ ಹೊಲದ ಕೆಲಸ ತಪ್ಪಿಸಿ."
  COLD_NIGHTS: "ರಾತ್ರಿಗಳು ತಂಪಾಗಿರಲಿವೆ (ಕನಿಷ್ಠ {tmin:.0f}°C). ಬೆಳೆಗಳನ್ನು ರಕ್ಷಿಸಲು ಸಂಜೆ ಲಘು ನೀರಾವರಿ ನೀಡಿ ಮತ್ತು ಎಳೆಯ ಜಾನುವಾರುಗಳನ್ನು ಬೆಚ್ಚಗೆ ಇರಿಸಿ."
  FUNGAL_DISEASE_RISK: "ಬೆಚ್ಚಗಿನ, ತೇವಾಂಶಯುಕ್ತ ಹವಾಮಾನ (ಆರ್ದ್ರತೆ {rh:.0f}% ಕ್ಕಿಂತ ಹೆಚ್ಚು) {crop} ಬೆಳೆಯಲ್ಲಿ ಶಿಲೀಂಧ್ರ ರೋಗಗಳಿಗೆ ಅನುಕೂಲಕರವಾಗಿದೆ. ಬೆಳೆಯನ್ನು ನಿಯಮಿತವಾಗಿ ಗಮನಿಸಿ ಮತ್ತು ಒಣ ದಿನದಂದು ಸಸ್ಯ ಸಂರಕ್ಷಣಾ ಕ್ರಮ ಕೈಗೊಳ್ಳಿ."
  HIGH_WIND: "ಬಲವಾದ ಗಾಳಿ ({wind:.0f} ಕಿ.ಮೀ/ಗಂಟೆ ವರೆಗೆ) ಬೀಸುವ ಸಾಧ್ಯತೆ ಇದೆ. ಸಿಂಪರಣೆ ಮಾಡಬೇಡಿ, ಎತ್ತರದ ಬೆಳೆಗಳು ಮತ್ತು ಎಳೆಯ ಮರಗಳಿಗೆ ಆಸರೆ ನೀಡಿ."
  SOWING_FAVOURABLE: "ಮುಂದಿನ 3 ದಿನಗಳಲ್ಲಿ {total:.0f} ಮಿ.ಮೀ ಮಳೆಯಿಂದ ಮಣ್ಣಿನಲ್ಲಿ ಉತ್ತಮ ತೇವಾಂಶ ಇರಲಿದೆ. {crop} ಬಿತ್ತನೆಗೆ ಪರಿಸ್ಥಿತಿ ಅನುಕೂಲಕರವಾಗಿದೆ."
  HARVEST_RAIN: "{day} ರಂದು ಮಳೆ ({rain:.0f} ಮಿ.ಮೀ) ಆಗುವ ಸಾಧ್ಯತೆ ಇದೆ ಮತ್ತು {crop} ಕಟಾವಿಗೆ ಸಿದ್ಧವಾಗಿದೆ. ಸಾಧ್ಯವಾದರೆ ಮಳೆಗಿಂತ ಮೊದಲು ಕಟಾವು ಮಾಡಿ ಮತ್ತು ಉತ್ಪನ್ನವನ್ನು ಮುಚ್ಚಿ ಇಡಿ."
  SPRAY_WINDOW: "ಮುಂದಿನ 2 ದಿನ ಒಣ ಮತ್ತು ಶಾಂತ ಹವಾಮಾನ ಇರಲಿದೆ: ಅಗತ್ಯವಿದ್ದರೆ ಸಿಂಪರಣೆಗೆ ಇದು ಉತ್ತಮ ಸಮಯ."
