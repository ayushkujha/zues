# INDICATIVE crop calendar for Dharwad district (northern transition zone, Karnataka).
# Typical rainfed kharif sowing starts with monsoon onset in June; rabi crops follow in
# September-November. Dates and durations are approximate starting points and MUST be
# checked against the district's package of practices (UAS Dharwad / KVK / DAMU).

district: Dharwad

crops:
